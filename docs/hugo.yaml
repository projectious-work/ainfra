baseURL: https://projectious-work.github.io/ainfra/
locale: en-US
title: ainfra

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: assets
      target: assets
    - source: content
      target: content
    - source: layouts
      target: layouts
    - source: static
      target: static
    - source: ../spec/doc/v1/roadmap.yaml
      target: data/roadmap.yaml

enableRobotsTXT: true

outputs:
  home: [HTML]
  section: [HTML]
  taxonomy: [HTML]
  term: [HTML]

params:
  description: Infrastructure for containerized AI.
  navbar:
    displayTitle: true
    displayLogo: true
    width: wide
    logo:
      path: logo/ainfra-light.svg
      dark: logo/ainfra-dark.svg
      link: /ainfra/
      width: 32
      height: 32
  page:
    width: wide
    displayPagination: true
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  footer:
    width: wide
    displayCopyright: true
    displayPoweredBy: false

menu:
  main:
    - name: Quick start
      pageRef: /docs/quick-start
      weight: 10
    - name: Blog
      pageRef: /blog
      weight: 15
    - name: Templates
      pageRef: /docs/templates
      weight: 20
    - name: Documentation
      pageRef: /docs
      weight: 30
    - name: Roadmap
      pageRef: /docs/roadmap
      weight: 40
    - name: Releases
      url: https://github.com/projectious-work/ainfra/releases
      weight: 50
    - name: Search
      weight: 60
      params:
        type: search
    - name: GitHub
      url: https://github.com/projectious-work/ainfra
      weight: 70
      params:
        icon: github

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

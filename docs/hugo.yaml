baseURL: https://projectious-work.github.io/ainfra/
locale: en-US
title: ainfra

module:
  imports:
    - path: github.com/imfing/hextra

enableRobotsTXT: true

outputs:
  home: [HTML]
  section: [HTML]
  taxonomy: [HTML]
  term: [HTML]

params:
  description: Infrastructure for containerized AI.
  navbar:
    displayTitle: true
    displayLogo: true
    width: wide
    logo:
      path: logo/ainfra-light.svg
      dark: logo/ainfra-dark.svg
      link: /ainfra/
      width: 32
      height: 32
  page:
    width: wide
    displayPagination: true
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  footer:
    width: wide
    displayCopyright: true
    displayPoweredBy: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 10
    - name: Search
      weight: 20
      params:
        type: search
    - name: GitHub
      url: https://github.com/projectious-work/ainfra
      weight: 40
      params:
        icon: github

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

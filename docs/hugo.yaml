baseURL: "https://projectious-work.github.io/ainfra/"
title: ainfra
description: >-
  Security-first, contract-driven infrastructure templates built with
  OpenTofu and Ansible.
theme: [hextra]
enableRobotsTXT: true
enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
  highlight:
    noClasses: false
  tableOfContents:
    endLevel: 4

outputs:
  home: [HTML, RSS]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown]

params:
  description: >-
    Security-first, contract-driven infrastructure templates built with
    OpenTofu and Ansible.
  images:
    - "logo/ainfra-social.svg"
  version: "main"
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: "logo/ainfra-light.svg"
      dark: "logo/ainfra-dark.svg"
      width: 40
      height: 40
    width: wide
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: normal
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
      js: "js/vendor/flexsearch.bundle.min.js"
  editURL:
    enable: true
    base: "https://github.com/projectious-work/ainfra/edit/main/docs/content"
  page:
    width: wide

menu:
  main:
    - identifier: documentation
      name: Documentation
      pageRef: /docs
      weight: 10
    - identifier: releases
      name: Releases
      weight: 20
    - identifier: latest
      name: "main (latest)"
      url: "https://projectious-work.github.io/ainfra/"
      parent: releases
      weight: 10
    - identifier: v0.1
      name: "v0.1"
      url: "https://projectious-work.github.io/ainfra/v0.1/"
      parent: releases
      weight: 20
    - identifier: search
      name: Search
      weight: 30
      params:
        type: search
    - name: GitHub
      weight: 40
      url: "https://github.com/projectious-work/ainfra"
      params:
        icon: github
    - identifier: theme-toggle
      name: Theme
      weight: 50
      params:
        type: theme-toggle

module:
  hugoVersion:
    extended: true
    min: "0.157.0"

taxonomies:
  tag: tags
  category: categories

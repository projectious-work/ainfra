apiVersion: ainfra.projectious.work/v1alpha1
kind: TemplateInput
metadata:
  template: hetzner-kubernetes-baseline
  environment: development
  disposable: true
spec:
  provider:
    location: fsn1
    projectTokenRef:
      type: environment
      name: HCLOUD_TOKEN
  topology:
    controlPlaneCount: 1
    workerCount: 0
    # Supported images:
    # - debian-13: official Hetzner Debian 13 image and the only image
    #   validated by the initial reference template.
    image: debian-13
    serverType: cx23
  network:
    privateCidr: 10.42.0.0/16
    # false means no billable public IPv4 resource or attachment is created.
    publicIPv4: false
    publicIPv6: false
    managementIngressCidrs: []
    workloadIngressCidrs: []
  access:
    adminSshPublicKeys:
      - ssh-ed25519 PLACEHOLDER operator@example.invalid
  state:
    mode: local-disposable

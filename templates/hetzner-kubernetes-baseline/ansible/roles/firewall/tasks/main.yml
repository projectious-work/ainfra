---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Install ainfra nftables policy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Ensure nftables is enabled
  ansible.builtin.service:
    name: nftables
    enabled: true
    state: started

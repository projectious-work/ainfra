---
- name: Require externally supplied pinned K3s inputs
  ansible.builtin.assert:
    that:
      - k3s_version == "v1.36.1+k3s1"
      - k3s_binary_sha256 is match('^[0-9a-f]{64}$')
      - k3s_cluster_token | length >= 32
    fail_msg: >-
      Supply the documented K3s SHA-256 and an external cluster token.
      Neither value is generated by this template.
  no_log: true

- name: Select the K3s release architecture
  ansible.builtin.set_fact:
    k3s_release_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Reject unsupported K3s architectures
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['x86_64', 'aarch64']
    fail_msg: "K3s supports only x86_64 and aarch64 in this template."

- name: Install the checksum-pinned K3s binary
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/k3s{% if k3s_release_arch == 'arm64' %}-arm64{% endif %}"
    dest: /usr/local/bin/k3s
    checksum: "sha256:{{ k3s_binary_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart k3s

- name: Install the private K3s token file
  ansible.builtin.copy:
    dest: /etc/ainfra-k3s-token
    content: "{{ k3s_cluster_token }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart k3s

- name: Install the K3s service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Enable the K3s service
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Verify control-plane membership from the first server
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, nodes, -o, name]
  register: k3s_nodes
  changed_when: false
  when:
    - not ansible_check_mode
    - inventory_hostname == groups['k3s_servers'][0]
  retries: 12
  delay: 10
  until: >-
    k3s_nodes.rc == 0 and
    k3s_nodes.stdout_lines | length == groups['k3s_cluster'] | length

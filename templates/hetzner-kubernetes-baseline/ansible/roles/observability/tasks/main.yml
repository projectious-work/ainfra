---
- name: Enable persistent systemd journal storage
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: ^#?Storage=
    line: Storage=persistent
    mode: "0644"
  notify: Restart journald

- name: Ensure audit service is enabled
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started
  # auditd is installed by the base role. On a pristine host check mode
  # predicts that install without creating the service unit.
  when: not ansible_check_mode

title = "ainfra local source scan"

[extend]
useDefault = true

[[allowlists]]
description = "Generated, private, cached, and upstream-mirror paths"
paths = [
  '''(^|/)\.git(/|$)''',
  '''(^|/)\.(ainfra|cargo|rustup|venv|mypy_cache|pytest_cache|ruff_cache)(/|$)''',
  '''(^|/)(\.aibox-home|\.root|node_modules)(/|$)''',
  '''(^|/)target(/|$)''',
  '''^context/templates/''',
  '''^docs/themes/hextra/''',
  '''^\.aibox-local\.(env|toml)$''',
  '''^aibox\.lock$''',
]

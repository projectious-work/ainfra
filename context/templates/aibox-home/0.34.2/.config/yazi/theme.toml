# =============================================================================
# Yazi theme — generated by aibox CLI from the active theme palette
# Docs: https://yazi-rs.github.io/docs/configuration/theme
# =============================================================================

[mgr]
cwd = { fg = "#FFC799" }
hovered = { fg = "#FFFFFF", bg = "#4E4034", bold = true }
preview_hovered = { fg = "#FFFFFF", bg = "#4E4034", bold = true }
find_keyword = { fg = "#FFC799", bold = true }
find_position = { fg = "#FFC799" }
marker_selected = { fg = "#99FFE4", bg = "#99FFE4" }
marker_copied = { fg = "#FFC799", bg = "#FFC799" }
marker_cut = { fg = "#FF8080", bg = "#FF8080" }

[indicator]
parent = { fg = "#A0A0A0" }
current = { fg = "#FFC799", bg = "#FFC799", bold = true }
preview = { fg = "#99FFE4" }
padding = { open = "▐", close = "▌" }

[tabs]
active = { fg = "#000000", bg = "#FFC799", bold = true }
inactive = { fg = "#A0A0A0", bg = "#232323", dim = true }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#000000", bg = "#99FFE4", bold = true }
normal_alt = { fg = "#99FFE4", bg = "#232323", bold = true }
select_main = { fg = "#000000", bg = "#FFC799", bold = true }
select_alt = { fg = "#FFC799", bg = "#232323", bold = true }
unset_main = { fg = "#000000", bg = "#FFC799", bold = true }
unset_alt = { fg = "#FFC799", bg = "#232323", bold = true }

[status]
overall = { fg = "#FFFFFF", bg = "#232323" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#FFC799" }
perm_read = { fg = "#FFC799" }
perm_write = { fg = "#FF8080" }
perm_exec = { fg = "#99FFE4" }
perm_sep = { fg = "#A0A0A0" }
progress_label = { fg = "#FFFFFF", bold = true }
progress_normal = { fg = "#FFC799", bg = "#232323" }
progress_error = { fg = "#FF8080", bg = "#232323", bold = true }

[input]
border = { fg = "#FFC799" }
title = { fg = "#FFC799", bg = "#101010", bold = true }
value = { fg = "#FFFFFF", bg = "#101010" }
selected = { fg = "#FFFFFF", bg = "#4E4034" }

[pick]
border = { fg = "#FFC799" }
active = { fg = "#FFC799" }
inactive = { fg = "#A0A0A0", bg = "#101010" }

[cmp]
border = { fg = "#FFC799" }
active = { fg = "#FFC799" }
inactive = { fg = "#A0A0A0", bg = "#101010" }

[tasks]
border = { fg = "#FFC799" }
title = { fg = "#FFC799", bg = "#101010", bold = true }
hovered = { fg = "#FFFFFF", bg = "#4E4034", bold = true }

[which]
mask = { bg = "#232323" }
cand = { fg = "#99FFE4" }
rest = { fg = "#A0A0A0" }
desc = { fg = "#FFC799" }
separator = "  "
separator_style = { fg = "#A0A0A0" }

[help]
on = { fg = "#99FFE4" }
run = { fg = "#FFC799" }
desc = { fg = "#FFFFFF", bg = "#101010" }
hovered = { fg = "#FFFFFF", bg = "#4E4034", bold = true }
footer = { fg = "#101010", bg = "#FFFFFF" }

[git]
modified = { fg = "#FFC799", bold = true }
untracked = { fg = "#FFC799", italic = true }
added = { fg = "#99FFE4" }
deleted = { fg = "#FF8080" }
updated = { fg = "#FFC799" }
ignored = { fg = "#A0A0A0", dim = true }

[filetype]
rules = [
    { url = "*/", fg = "#FFC799", bold = true },
    { url = "*.rs", fg = "#FFC799" },
    { url = "*.py", fg = "#FFC799" },
    { url = "*.js", fg = "#FFC799" },
    { url = "*.ts", fg = "#FFC799" },
    { url = "*.sh", fg = "#99FFE4" },
    { url = "*.toml", fg = "#99FFE4" },
    { url = "*.yaml", fg = "#99FFE4" },
    { url = "*.yml", fg = "#99FFE4" },
    { url = "*.json", fg = "#99FFE4" },
    { url = "*.kdl", fg = "#99FFE4" },
    { url = "*.html", fg = "#FFC799" },
    { url = "*.css", fg = "#FFC799" },
    { url = "*.md", fg = "#FFFFFF" },
    { url = "*.tex", fg = "#99FFE4" },
    { url = "*.typ", fg = "#99FFE4" },
    { url = "*.pdf", fg = "#FF8080" },
    { url = "*.png", fg = "#FFC799" },
    { url = "*.jpg", fg = "#FFC799" },
    { url = "*.jpeg", fg = "#FFC799" },
    { url = "*.gif", fg = "#FFC799" },
    { url = "*.svg", fg = "#FFC799" },
    { url = "*.zip", fg = "#FFC799" },
    { url = "*.tar*", fg = "#FFC799" },
    { url = "*.gz", fg = "#FFC799" },
    { url = "*.gitignore", fg = "#A0A0A0" },
    { url = ".env*", fg = "#FF8080" },
    { url = "Dockerfile*", fg = "#FFC799" },
    { url = "Makefile", fg = "#99FFE4" },
    { url = "Cargo.toml", fg = "#FFC799", bold = true },
    { url = "Cargo.lock", fg = "#A0A0A0" },
]

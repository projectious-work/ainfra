# =============================================================================
# Yazi theme — generated by aibox CLI from the active theme palette
# Docs: https://yazi-rs.github.io/docs/configuration/theme
# =============================================================================

[mgr]
cwd = { fg = "#FF7B00" }
hovered = { fg = "#101010", bg = "#FFFFFF" }
preview_hovered = { bg = "#313244", underline = true }
find_keyword = { fg = "#FF7B00", bold = true }
find_position = { fg = "#F85B2A", italic = true }
marker_selected = { fg = "#99FFE4", bg = "#99FFE4" }
marker_copied = { fg = "#FF7B00", bg = "#FF7B00" }
marker_cut = { fg = "#F44747", bg = "#F44747" }

[tabs]
active = { fg = "#101010", bg = "#FF7B00", bold = true }
inactive = { fg = "#5C5C5C", bg = "#313244" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#101010", bg = "#99FFE4", bold = true }
normal_alt = { fg = "#99FFE4", bg = "#313244", bold = true }
select_main = { fg = "#101010", bg = "#FF7B00", bold = true }
select_alt = { fg = "#FF7B00", bg = "#313244", bold = true }
unset_main = { fg = "#101010", bg = "#F85B2A", bold = true }
unset_alt = { fg = "#F85B2A", bg = "#313244", bold = true }

[status]
overall = { fg = "#FFFFFF", bg = "#313244" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#FF7B00" }
perm_read = { fg = "#FF7B00" }
perm_write = { fg = "#F44747" }
perm_exec = { fg = "#99FFE4" }
perm_sep = { fg = "#5C5C5C" }
progress_label = { fg = "#FFFFFF", bold = true }
progress_normal = { fg = "#FF7B00", bg = "#313244" }
progress_error = { fg = "#F44747", bg = "#313244" }

[input]
border = { fg = "#FF7B00" }
title = { fg = "#FF7B00", bg = "#101010", bold = true }
value = { fg = "#FFFFFF", bg = "#101010" }
selected = { reversed = true }

[pick]
border = { fg = "#FF7B00" }
active = { fg = "#F85B2A" }
inactive = { fg = "#5C5C5C", bg = "#101010" }

[cmp]
border = { fg = "#FF7B00" }
active = { fg = "#F85B2A" }
inactive = { fg = "#5C5C5C", bg = "#101010" }

[tasks]
border = { fg = "#FF7B00" }
title = { fg = "#FF7B00", bg = "#101010", bold = true }
hovered = { bg = "#313244", underline = true }

[which]
mask = { bg = "#313244" }
cand = { fg = "#FFC799" }
rest = { fg = "#5C5C5C" }
desc = { fg = "#F85B2A" }
separator = "  "
separator_style = { fg = "#5C5C5C" }

[help]
on = { fg = "#FFC799" }
run = { fg = "#F85B2A" }
desc = { fg = "#FFFFFF", bg = "#101010" }
hovered = { bg = "#313244", bold = true }
footer = { fg = "#101010", bg = "#FFFFFF" }

[git]
modified = { fg = "#FF7B00" }
untracked = { fg = "#F85B2A" }
added = { fg = "#99FFE4" }
deleted = { fg = "#F44747" }
updated = { fg = "#FF7B00" }
ignored = { fg = "#5C5C5C" }

[filetype]
rules = [
    { url = "*/", fg = "#FF7B00", bold = true },
    { url = "*.rs", fg = "#FFC799" },
    { url = "*.py", fg = "#FF7B00" },
    { url = "*.js", fg = "#FF7B00" },
    { url = "*.ts", fg = "#FF7B00" },
    { url = "*.sh", fg = "#99FFE4" },
    { url = "*.toml", fg = "#FFC799" },
    { url = "*.yaml", fg = "#FFC799" },
    { url = "*.yml", fg = "#FFC799" },
    { url = "*.json", fg = "#FFC799" },
    { url = "*.kdl", fg = "#FFC799" },
    { url = "*.html", fg = "#FFC799" },
    { url = "*.css", fg = "#FF7B00" },
    { url = "*.md", fg = "#FFFFFF" },
    { url = "*.tex", fg = "#99FFE4" },
    { url = "*.typ", fg = "#99FFE4" },
    { url = "*.pdf", fg = "#F44747" },
    { url = "*.png", fg = "#F85B2A" },
    { url = "*.jpg", fg = "#F85B2A" },
    { url = "*.jpeg", fg = "#F85B2A" },
    { url = "*.gif", fg = "#F85B2A" },
    { url = "*.svg", fg = "#F85B2A" },
    { url = "*.zip", fg = "#FFC799" },
    { url = "*.tar*", fg = "#FFC799" },
    { url = "*.gz", fg = "#FFC799" },
    { url = "*.gitignore", fg = "#5C5C5C" },
    { url = ".env*", fg = "#F44747" },
    { url = "Dockerfile*", fg = "#FF7B00" },
    { url = "Makefile", fg = "#99FFE4" },
    { url = "Cargo.toml", fg = "#FFC799", bold = true },
    { url = "Cargo.lock", fg = "#5C5C5C" },
]

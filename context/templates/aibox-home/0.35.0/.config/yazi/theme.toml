# =============================================================================
# Yazi theme — generated by aibox CLI from the active theme palette
# Docs: https://yazi-rs.github.io/docs/configuration/theme
# =============================================================================

[mgr]
cwd = { fg = "#FFFFFF" }
hovered = { fg = "#000000", bg = "#008888", bold = true }
preview_hovered = { fg = "#000000", bg = "#008888", bold = true }
find_keyword = { fg = "#FFFF55", bold = true }
find_position = { fg = "#FF8AFF" }
marker_selected = { fg = "#55FF55" }
marker_copied = { fg = "#FF8AFF" }
marker_cut = { fg = "#FF7B7B" }

[indicator]
parent = { fg = "#C4C4C4" }
current = { fg = "#0000AA", bg = "#FFFFFF", bold = true }
preview = { fg = "#55FFFF" }
padding = { open = "▐", close = "▌" }

[tabs]
active = { fg = "#0000AA", bg = "#FFFFFF", bold = true }
inactive = { fg = "#C4C4C4", bg = "#000066", dim = true }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#0000AA", bg = "#55FF55", bold = true }
normal_alt = { fg = "#55FF55", bg = "#000066", bold = true }
select_main = { fg = "#0000AA", bg = "#FFFFFF", bold = true }
select_alt = { fg = "#FFFFFF", bg = "#000066", bold = true }
unset_main = { fg = "#0000AA", bg = "#FF8AFF", bold = true }
unset_alt = { fg = "#FF8AFF", bg = "#000066", bold = true }

[status]
overall = { fg = "#FFFF55", bg = "#000066" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#FFFFFF" }
perm_read = { fg = "#FFFF55" }
perm_write = { fg = "#FF7B7B" }
perm_exec = { fg = "#55FF55" }
perm_sep = { fg = "#C4C4C4" }
progress_label = { fg = "#FFFF55", bold = true }
progress_normal = { fg = "#FFFFFF", bg = "#000066" }
progress_error = { fg = "#FF7B7B", bg = "#000066", bold = true }

[input]
border = { fg = "#FFFFFF" }
title = { fg = "#FFFFFF", bg = "#0000AA", bold = true }
value = { fg = "#FFFF55", bg = "#0000AA" }
selected = { fg = "#000000", bg = "#008888" }

[pick]
border = { fg = "#FFFFFF" }
active = { fg = "#FF8AFF" }
inactive = { fg = "#C4C4C4", bg = "#0000AA" }

[cmp]
border = { fg = "#FFFFFF" }
active = { fg = "#FF8AFF" }
inactive = { fg = "#C4C4C4", bg = "#0000AA" }

[tasks]
border = { fg = "#FFFFFF" }
title = { fg = "#FFFFFF", bg = "#0000AA", bold = true }
hovered = { fg = "#000000", bg = "#008888", bold = true }

[which]
mask = { bg = "#000066" }
cand = { fg = "#55FFFF" }
rest = { fg = "#C4C4C4" }
desc = { fg = "#FF8AFF" }
separator = "  "
separator_style = { fg = "#C4C4C4" }

[help]
on = { fg = "#55FFFF" }
run = { fg = "#FF8AFF" }
desc = { fg = "#FFFF55", bg = "#0000AA" }
hovered = { fg = "#000000", bg = "#008888", bold = true }
footer = { fg = "#0000AA", bg = "#FFFF55" }

[git]
modified = { fg = "#FFFF55", bold = true }
untracked = { fg = "#FF8AFF", italic = true }
added = { fg = "#55FF55" }
deleted = { fg = "#FF7B7B" }
updated = { fg = "#FFFFFF" }
ignored = { fg = "#C4C4C4", dim = true }

[filetype]
rules = [
    { url = "*/", fg = "#FFFFFF", bold = true },
    { url = "*.rs", fg = "#FFAA55" },
    { url = "*.py", fg = "#FFFF55" },
    { url = "*.js", fg = "#FFFF55" },
    { url = "*.ts", fg = "#FFFFFF" },
    { url = "*.sh", fg = "#55FF55" },
    { url = "*.toml", fg = "#55FFFF" },
    { url = "*.yaml", fg = "#55FFFF" },
    { url = "*.yml", fg = "#55FFFF" },
    { url = "*.json", fg = "#55FFFF" },
    { url = "*.kdl", fg = "#55FFFF" },
    { url = "*.html", fg = "#FFAA55" },
    { url = "*.css", fg = "#FFFFFF" },
    { url = "*.md", fg = "#FFFF55" },
    { url = "*.tex", fg = "#55FF55" },
    { url = "*.typ", fg = "#55FF55" },
    { url = "*.pdf", fg = "#FF7B7B" },
    { url = "*.png", fg = "#FF8AFF" },
    { url = "*.jpg", fg = "#FF8AFF" },
    { url = "*.jpeg", fg = "#FF8AFF" },
    { url = "*.gif", fg = "#FF8AFF" },
    { url = "*.svg", fg = "#FF8AFF" },
    { url = "*.zip", fg = "#FFAA55" },
    { url = "*.tar*", fg = "#FFAA55" },
    { url = "*.gz", fg = "#FFAA55" },
    { url = "*.gitignore", fg = "#C4C4C4" },
    { url = ".env*", fg = "#FF7B7B" },
    { url = "Dockerfile*", fg = "#FFFFFF" },
    { url = "Makefile", fg = "#55FF55" },
    { url = "Cargo.toml", fg = "#FFAA55", bold = true },
    { url = "Cargo.lock", fg = "#C4C4C4" },
]

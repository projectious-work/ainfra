baseURL: "https://projectious-work.github.io/ainfra-templates/"
title: ainfra
description: >-
  Security-first, contract-driven infrastructure templates built with
  OpenTofu and Ansible.
theme: [docsy]
enableRobotsTXT: true
enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
  highlight:
    noClasses: false
  tableOfContents:
    endLevel: 4

outputs:
  home: [HTML, RSS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  hugoMinVersion: "0.157.0"
  productionURL: "https://projectious-work.github.io/ainfra-templates/"
  offlineSearch: true
  offlineSearchSummaryLength: 200
  offlineSearchMaxResults: 25
  ui:
    navbar_logo: true
    navbar_theme: dark
    showLightDarkModeMenu: true
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_search_disable: false
    feedback:
      enable: false
  links:
    user:
      - name: GitHub
        url: "https://github.com/projectious-work/ainfra-templates"
        icon: "fa-brands fa-github"
        desc: Source code and issue tracker
  copyright:
    authors: "projectious.work"
    from_year: 2026

menu:
  main:
    - name: Documentation
      weight: 10
      url: "/docs/"
    - name: GitHub
      weight: 20
      url: "https://github.com/projectious-work/ainfra-templates"
      pre: "<i class='fa-brands fa-github' aria-hidden='true'></i>"

module:
  replacements:
    - "github.com/FortAwesome/Font-Awesome -> ../node_modules/@fortawesome/fontawesome-free"
    - "github.com/twbs/bootstrap -> ../node_modules/bootstrap"
  mounts:
    - source: assets
      target: assets
    - source: static
      target: static
    - source: node_modules/bootstrap
      target: assets/vendor/bootstrap
    - source: node_modules/@fortawesome/fontawesome-free
      target: assets/vendor/Font-Awesome
    - source: node_modules/@fortawesome/fontawesome-free/webfonts
      target: static/webfonts

taxonomies:
  tag: tags
  category: categories

- name: top-level-help
  args:
    - --help
  expect:
    exit: 0
    stdout_contains:
      - validate
      - doctor
      - plan
      - apply
      - destroy
      - outputs
      - inventory
    stderr_contains: []

- name: version
  args:
    - --version
  expect:
    exit: 0
    stdout_contains:
      - 0.1.0.dev0
    stderr_contains: []

- name: validate-v1alpha1-input
  args:
    - validate
    - <ROOT>/tests/fixtures/contracts/v1alpha1/valid/template-input.json
  expect:
    exit: 0
    stdout_contains:
      - "valid TemplateInput:"
    stderr_contains: []

- name: reject-missing-reviewed-plan
  args:
    - apply
    - hetzner-kubernetes-baseline
    - --input
    - <ROOT>/tests/fixtures/contracts/v1alpha1/valid/template-input.json
    - --approve
    - missing-plan
  expect:
    exit: 6
    stdout_contains: []
    stderr_contains:
      - AINFRA-E600
      - "reviewed plan does not exist: missing-plan"

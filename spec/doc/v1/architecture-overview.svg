<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ainfra v1 product execution flow</title>
  <desc id="desc">A deployment and locked template enter the Go CLI. The CLI validates security, runs OpenTofu, converts non-secret output into inventory, and runs Ansible Runner against target hosts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#334155; stroke-width:2; rx:12; }
      .accent { fill:#e0f2fe; stroke:#0369a1; stroke-width:2; rx:12; }
      .safe { fill:#ecfdf5; stroke:#047857; stroke-width:2; rx:12; }
      .text { font-family:system-ui,sans-serif; font-size:18px; fill:#0f172a; text-anchor:middle; }
      .small { font-family:system-ui,sans-serif; font-size:14px; fill:#334155; text-anchor:middle; }
      .line { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="white"/>
  <text x="600" y="42" class="text" style="font-size:26px;font-weight:700">ainfra v1 execution architecture</text>
  <rect x="50" y="100" width="260" height="115" class="box"/>
  <text x="180" y="140" class="text">Deployment</text>
  <text x="180" y="170" class="small">ainfra.yaml + lock</text>
  <text x="180" y="194" class="small">native tfvars + Ansible vars</text>
  <rect x="50" y="285" width="260" height="115" class="box"/>
  <text x="180" y="325" class="text">Locked template</text>
  <text x="180" y="355" class="small">manifest + tofu/ + ansible/</text>
  <text x="180" y="379" class="small">local or immutable Git commit</text>
  <rect x="405" y="105" width="330" height="295" class="accent"/>
  <text x="570" y="145" class="text" style="font-weight:700">ainfra Go CLI</text>
  <text x="570" y="185" class="small">source resolution and digest verification</text>
  <text x="570" y="217" class="small">path, secret, and plan-binding policy</text>
  <text x="570" y="249" class="small">lifecycle and run evidence</text>
  <text x="570" y="281" class="small">safe child-process execution</text>
  <text x="570" y="313" class="small">standard output validation</text>
  <text x="570" y="345" class="small">deterministic inventory generation</text>
  <text x="570" y="377" class="small">diagnostics and machine output</text>
  <rect x="840" y="85" width="280" height="105" class="box"/>
  <text x="980" y="125" class="text">OpenTofu CLI</text>
  <text x="980" y="155" class="small">init · plan · apply · output · state</text>
  <rect x="840" y="265" width="280" height="105" class="box"/>
  <text x="980" y="305" class="text">Ansible Runner CLI</text>
  <text x="980" y="335" class="small">configure · events · check mode</text>
  <rect x="840" y="470" width="280" height="105" class="safe"/>
  <text x="980" y="510" class="text">Target infrastructure</text>
  <text x="980" y="540" class="small">provider resources and configured hosts</text>
  <rect x="405" y="485" width="330" height="105" class="safe"/>
  <text x="570" y="525" class="text">Non-secret handoff</text>
  <text x="570" y="555" class="small">validated output.json → inventory.yaml</text>
  <path d="M310 158 H405" class="line"/>
  <path d="M310 342 H405" class="line"/>
  <path d="M735 175 L840 138" class="line"/>
  <path d="M840 160 L735 505" class="line"/>
  <path d="M735 540 L840 330" class="line"/>
  <path d="M980 190 V470" class="line"/>
  <path d="M980 370 V470" class="line"/>
  <text x="600" y="655" class="small">OpenTofu and Ansible remain independent child processes with directly reproducible commands.</text>
</svg>

  <path d="M650 372 L350 425" class="line"/><path d="M650 372 L485 425" class="line"/>
  <path d="M650 372 L620 425" class="line"/><path d="M650 372 L755 425" class="line"/>
  <path d="M650 372 L890 425" class="line"/><path d="M650 372 L1025 425" class="line"/>
  <path d="M650 372 L1190 425" class="line"/>
  <rect x="300" y="530" width="190" height="62" class="box"/>
  <text x="395" y="566" class="text">diagnostic</text>
  <rect x="555" y="530" width="190" height="62" class="box"/>
  <text x="650" y="566" class="text">reconcile</text>
  <rect x="810" y="530" width="190" height="62" class="box"/>
  <text x="905" y="566" class="text">config</text>
  <path d="M650 372 L395 530" class="line"/><path d="M650 372 V530" class="line"/>
  <path d="M650 372 L905 530" class="line"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820" role="img" aria-labelledby="title desc">
  <title id="title">ainfra Go package dependency direction</title>
  <desc id="desc">The command package depends on application use cases. Application use cases coordinate cohesive domain packages. Configuration, security, execution, logging, engine evidence, diagnostics, and output form focused shared boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#475569; stroke-width:2; rx:10; }
      .top { fill:#e0f2fe; stroke:#0369a1; stroke-width:2; rx:10; }
      .base { fill:#ecfdf5; stroke:#047857; stroke-width:2; rx:10; }
      .text { font-family:system-ui,sans-serif; font-size:17px; fill:#0f172a; text-anchor:middle; }
      .small { font-family:system-ui,sans-serif; font-size:13px; fill:#475569; text-anchor:middle; }
      .line { stroke:#475569; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
      .direct { stroke:#0284c7; stroke-width:1.8; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1300" height="820" fill="white"/>
  <text x="650" y="38" class="text" style="font-size:26px;font-weight:700">Go package dependency direction</text>
  <rect x="525" y="70" width="250" height="70" class="top"/>
  <text x="650" y="105" class="text">cmd/ainfra</text>
  <text x="650" y="127" class="small">composition only</text>
  <rect x="525" y="180" width="250" height="70" class="top"/>
  <text x="650" y="215" class="text">command</text>
  <text x="650" y="237" class="small">syntax and rendering selection</text>
  <rect x="525" y="290" width="250" height="82" class="top"/>
  <text x="650" y="325" class="text">app</text>
  <text x="650" y="348" class="small">use-case sequencing</text>
  <path d="M650 140 V180" class="line"/>
  <path d="M650 250 V290" class="line"/>
  <path d="M775 205 C1040 205 1080 420 905 530" class="direct"/>
  <path d="M775 220 C1160 265 1010 610 705 660" class="direct"/>
  <path d="M775 235 C1240 300 1150 610 955 660" class="direct"/>
  <g>
    <rect x="20" y="425" width="120" height="62" class="box"/><text x="80" y="461" class="text">project</text>
    <rect x="155" y="425" width="120" height="62" class="box"/><text x="215" y="461" class="text">template</text>
    <rect x="290" y="425" width="120" height="62" class="box"/><text x="350" y="461" class="text">source</text>
    <rect x="425" y="425" width="120" height="62" class="box"/><text x="485" y="461" class="text">lock</text>
    <rect x="560" y="425" width="120" height="62" class="box"/><text x="620" y="461" class="text">tofu</text>
    <rect x="695" y="425" width="120" height="62" class="box"/><text x="755" y="461" class="text">inventory</text>
    <rect x="830" y="425" width="120" height="62" class="box"/><text x="890" y="461" class="text">ansible</text>
    <rect x="965" y="425" width="120" height="62" class="box"/><text x="1025" y="461" class="text">run</text>
    <rect x="1100" y="425" width="180" height="62" class="box"/><text x="1190" y="461" class="text">migration</text>
  </g>

  <path d="M620 487 L1160 660" class="line"/><path d="M890 487 L1182 660" class="line"/>
  <text x="1065" y="635" class="small" style="fill:#0284c7">dashed: direct command dependencies</text>
  <text x="650" y="785" class="small">Adapters never call each other; app owns sequencing. Dependency cycles are forbidden.</text>
</svg>

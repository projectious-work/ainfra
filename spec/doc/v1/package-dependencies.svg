<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">ainfra Go package dependency direction</title>
  <desc id="desc">The command package depends on application use cases. Application use cases coordinate project, template, source, lock, OpenTofu, inventory, Ansible, run, and security packages. Adapters use the shared safe execution boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#475569; stroke-width:2; rx:10; }
      .top { fill:#e0f2fe; stroke:#0369a1; stroke-width:2; rx:10; }
      .base { fill:#ecfdf5; stroke:#047857; stroke-width:2; rx:10; }
      .text { font-family:system-ui,sans-serif; font-size:17px; fill:#0f172a; text-anchor:middle; }
      .small { font-family:system-ui,sans-serif; font-size:13px; fill:#475569; text-anchor:middle; }
      .line { stroke:#475569; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1300" height="760" fill="white"/>
  <text x="650" y="38" class="text" style="font-size:26px;font-weight:700">Go package dependency direction</text>
  <rect x="525" y="70" width="250" height="70" class="top"/>
  <text x="650" y="105" class="text">cmd/ainfra</text>
  <text x="650" y="127" class="small">composition only</text>
  <rect x="525" y="180" width="250" height="70" class="top"/>
  <text x="650" y="215" class="text">command</text>
  <text x="650" y="237" class="small">syntax and rendering selection</text>
  <rect x="525" y="290" width="250" height="82" class="top"/>
  <text x="650" y="325" class="text">app</text>
  <text x="650" y="348" class="small">use-case sequencing</text>
  <path d="M650 140 V180" class="line"/>
  <path d="M650 250 V290" class="line"/>
  <g>
    <rect x="35" y="445" width="135" height="62" class="box"/><text x="102" y="481" class="text">project</text>
    <rect x="190" y="445" width="135" height="62" class="box"/><text x="257" y="481" class="text">template</text>
    <rect x="345" y="445" width="135" height="62" class="box"/><text x="412" y="481" class="text">source</text>
    <rect x="500" y="445" width="135" height="62" class="box"/><text x="567" y="481" class="text">lock</text>
    <rect x="655" y="445" width="135" height="62" class="box"/><text x="722" y="481" class="text">tofu</text>
    <rect x="810" y="445" width="135" height="62" class="box"/><text x="877" y="481" class="text">inventory</text>
    <rect x="965" y="445" width="135" height="62" class="box"/><text x="1032" y="481" class="text">ansible</text>
    <rect x="1120" y="445" width="135" height="62" class="box"/><text x="1187" y="481" class="text">run</text>
  </g>
  <path d="M650 372 L102 445" class="line"/><path d="M650 372 L257 445" class="line"/>
  <path d="M650 372 L412 445" class="line"/><path d="M650 372 L567 445" class="line"/>
  <path d="M650 372 L722 445" class="line"/><path d="M650 372 L877 445" class="line"/>
  <path d="M650 372 L1032 445" class="line"/><path d="M650 372 L1187 445" class="line"/>
  <rect x="300" y="615" width="190" height="68" class="base"/>
  <text x="395" y="650" class="text">security</text><text x="395" y="672" class="small">focused policies</text>
  <rect x="555" y="615" width="190" height="68" class="base"/>
  <text x="650" y="650" class="text">exec</text><text x="650" y="672" class="small">only process boundary</text>
  <rect x="810" y="615" width="190" height="68" class="base"/>
  <text x="905" y="650" class="text">diagnostic + output</text><text x="905" y="672" class="small">stable interfaces</text>
  <path d="M412 507 L610 615" class="line"/><path d="M722 507 L650 615" class="line"/>
  <path d="M1032 507 L690 615" class="line"/><path d="M102 507 L360 615" class="line"/>
  <path d="M257 507 L380 615" class="line"/><path d="M877 507 L425 615" class="line"/>
  <path d="M1187 507 L940 615" class="line"/><path d="M567 507 L900 615" class="line"/>
  <text x="650" y="730" class="small">Adapters never call each other; app owns sequencing. Dependency cycles are forbidden.</text>
</svg>

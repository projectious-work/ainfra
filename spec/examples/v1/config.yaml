# Example user or explicitly selected CLI configuration.
apiVersion: ainfra.projectious.work/v1
kind: CLIConfig
ui:
  format: text
  outputStyle: auto
  color: auto
  nonInteractive: false
logging:
  level: warn
  destinations:
    - type: stderr
      format: text
    - type: file
      path: .ainfra/logs/ainfra.jsonl
      format: json
      rotation:
        maxSizeMiB: 10
        maxBackups: 5
        maxAgeDays: 7
        compress: true
paths:
  cache: .ainfra/cache
  runs: .ainfra/runs

[package]
name = "ainfra"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.96"
description = "Secure, contract-driven infrastructure lifecycle tooling"
license = "MIT"
repository = "https://github.com/projectious-work/ainfra"

[dependencies]
clap = { version = "=4.5.41", features = ["derive"] }
ipnet = "=2.12.0"
jsonschema = { version = "=0.49.1", default-features = false }
pep440_rs = "=0.7.3"
regex = "=1.13.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde_yaml = "=0.9.34"
thiserror = "=2.0.12"

[dev-dependencies]
assert_cmd = "=2.0.17"
predicates = "=3.1.3"
tempfile = "=3.27.0"

[lints.clippy]
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
unsafe_code = "forbid"

[project]
name = "ainfra-repository-tooling"
version = "0.1.0.dev0"
description = "Development-only checks for the Rust ainfra project"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "ansible-core==2.21.2",
  "ansible-lint==26.6.0",
  "pytest==8.4.2",
  "ruff==0.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
